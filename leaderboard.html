<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

<body>
<header>
  <h1><a href="index.html">gambling</a></h1>
  <nav id="nav"></nav>
  <div id="who"></div>
</header>
<main>
  <section id="login" class="panel" hidden>
    <h2>Sign in to see the leaderboard</h2>
    <button id="signin" class="big">Sign in with Google</button>

    <div class="tablewrap"><table id="board" class="data"></table></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script type="module" src="leaderboard.js"></script>
