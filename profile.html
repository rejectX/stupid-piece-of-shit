<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile – gambling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">gambling</a></h1>
  <nav id="nav"></nav>
  <div id="who"></div>
</header>
<main>
  <section id="login" class="panel" hidden>
    <h2>Sign in to view profiles</h2>
    <button id="signin" class="big">Sign in with Google</button>
  </section>
  <section id="content" hidden>
    <div class="profilehead">
      <div><h2 id="pname">Loading…</h2><p id="pstats" class="muted"></p></div>
      <a id="tradeBtn" class="btn big" hidden>Trade with this collector</a>
    </div>
    <div id="progress"></div>
    <div id="chips" class="chips"></div>
    <div id="grid" class="grid"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script type="module" src="profile.js"></script>
</body>
</html>
