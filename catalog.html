<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog – Demon Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Demon Deck</a></h1>
  <nav id="nav"></nav>
</header>
<main>
  <section id="login" class="panel" hidden>
    <h2>Sign in to see the catalog</h2>
    <button id="signin" class="big">Sign in with Google</button>
  </section>
  <section id="content" hidden>
    <h2>Rarity overview</h2>
    <p id="status" class="muted">Counting cards…</p>
    <div class="tablewrap"><table id="tiers" class="data"></table></div>
    <h2>Every level</h2>
    <input id="levelFilter" placeholder="Search levels" aria-label="Search levels" autocomplete="off">
    <div class="tablewrap"><table id="levels" class="data"></table></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script type="module" src="catalog.js"></script>
</body>
</html>
